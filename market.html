<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Overview</title><style>*{box-sizing:border-box}body{margin:0;background:#faf7f0;color:#394b40;font:15px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:18px}h1{margin:4px 0;font-size:28px}small{opacity:.85}h2{font-size:12px;letter-spacing:1px;margin:18px 0 8px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{border-radius:12px;padding:14px;background:#818f82;color:white;text-decoration:none;min-width:0}.card:nth-child(n+5){background:#e9cdb2;color:#594637}.card:nth-child(7){background:#f4d77c}.card:nth-child(8){background:#ad383c;color:white}.name{font-weight:650;min-height:42px;margin-top:6px}.value{font-size:clamp(17px,2.5vw,30px);font-weight:750;font-variant-numeric:tabular-nums}.change{margin:5px 0;color:inherit}svg{width:100%;height:85px;display:block}footer{margin-top:14px;font-size:12px}a{color:inherit}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:10px}}</style><main><small>LIFE & AI / INVESTMENT</small><h1>Market Overview</h1><small id="status">네이버 시세 연결 확인 중</small><h2>GLOBAL FINANCIAL MARKETS</h2><div class="grid" id="grid"></div><footer>출처: <a href="https://finance.naver.com/" target="_blank">네이버 증권</a> · 시세 및 그래프는 데이터 수신 시에만 표시됩니다.</footer></main><script>
const markets=[['S&P 500','SPX','https://finance.naver.com/world/sise.naver?symbol=SPI@SPX'],['나스닥 종합','NASDAQ','https://finance.naver.com/world/sise.naver?symbol=NAS@IXIC'],['코스피','KOSPI','https://finance.naver.com/sise/sise_index.naver?code=KOSPI'],['필라델피아 반도체지수','SOX','https://finance.naver.com/world/'],['원/달러 환율','USD/KRW','https://finance.naver.com/marketindex/'],['미 30년 국채금리','US 30Y','https://finance.naver.com/world/'],['국제 금','GOLD · USD/oz','https://finance.naver.com/marketindex/'],['공포지수','VIX','https://finance.naver.com/world/']];
function render(data={}){document.getElementById('grid').replaceChildren(...markets.map(([name,key,url],i)=>{let a=document.createElement('a');a.className='card';a.href=url;a.target='_blank';a.rel='noopener';let d=data[key];for(let [cls,t] of [['symbol',key],['name',name],['value',d?.value??'—'],['change',d?.change??'시세 연결 대기']]){let el=document.createElement('div');el.className=cls;el.textContent=t;a.append(el)}let s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 180 85');let p=d?.points;if(Array.isArray(p)&&p.length>1&&p.every(Number.isFinite)){let min=Math.min(...p),max=Math.max(...p);let l=document.createElementNS(s.namespaceURI,'polyline');l.setAttribute('points',p.map((v,j)=>`${3+j*174/(p.length-1)},${78-(v-min)/(max-min||1)*70}`).join(' '));l.setAttribute('fill','none');l.setAttribute('stroke',i<4||i===7?'#f4d77c':'#526f58');l.setAttribute('stroke-width','2.5');s.append(l)}else{let t=document.createElementNS(s.namespaceURI,'text');t.setAttribute('x','90');t.setAttribute('y','45');t.setAttribute('text-anchor','middle');t.setAttribute('fill','currentColor');t.setAttribute('font-size','11');t.textContent='그래프 데이터 대기';s.append(t)}a.append(s);let time=document.createElement('small');time.textContent=d?.asOf??'네이버 상세 보기 ↗';a.append(time);return a}))}render();async function refresh(){try{let r=await fetch('./market-data.json',{cache:'no-store'});if(!r.ok)throw Error();let d=await r.json();if(d.source!=='NAVER')throw Error();render(d.markets);document.getElementById('status').textContent='데이터 기준: '+(d.asOf??'미표기')}catch(e){document.getElementById('status').textContent='네이버 자동 수집 미연결 · 상세 링크 이용'}}refresh();setInterval(refresh,300000);
</script></html>
