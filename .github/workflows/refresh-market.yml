name: Refresh market observations
on:
  push:
    branches: [market-permission-check-20261126]
    paths:
      - scripts/refresh_market.py
      - .github/workflows/refresh-market.yml
  workflow_dispatch:
  schedule:
    - cron: '17 23 * * 1-6'
permissions:
  contents: write
concurrency:
  group: market-refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refresh_market.py
      - name: Commit changed observations only
        run: |
          git add -- market-data.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh daily market observations'
          git push origin HEAD
