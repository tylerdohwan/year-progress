<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Year Progress</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#171717;font-family:system-ui,-apple-system,sans-serif}.widget{max-width:960px;margin:auto;padding:12px 14px 18px}header{display:flex;align-items:center;gap:8px}h1{font-size:21px;margin:0}button{border:0;background:none;color:#888;cursor:pointer;font-size:22px;padding:0 5px}button:focus-visible{outline:2px solid #e58b42}header small{margin-left:auto;color:#777;font-size:12px}.pct{color:#e58b42;font-size:26px;font-weight:700;margin:10px 0 8px}.grid{display:grid;grid-template-columns:repeat(37,minmax(0,1fr));gap:3px}.day{aspect-ratio:1;border-radius:1.5px;background:#e9ecef}.done{background:linear-gradient(145deg,#f5ae69,#e58b42)}footer{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}footer small{display:block;color:#777;font-size:13px;margin-bottom:5px}footer strong{font-size:20px}@media(max-width:350px){.grid{gap:2px}footer strong{font-size:17px}}</style></head><body><main class="widget"><header><button id="prev" aria-label="이전 연도">‹</button><h1 id="year"></h1><button id="next" aria-label="다음 연도">›</button><small>YEAR PROGRESS</small></header><div class="pct" id="pct"></div><div class="grid" id="grid" role="img"></div><footer><div><small>진행 일수</small><strong id="elapsed"></strong></div><div><small>남은 일수</small><strong id="remaining"></strong></div><div><small>전체 일수</small><strong id="total"></strong></div></footer></main><script>const $=id=>document.getElementById(id);const today=()=>Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date()).map(p=>[p.type,p.value]));let year=+today().year;function render(){const p=today(),start=Date.UTC(year,0,1),n=(Date.UTC(year+1,0,1)-start)/86400000,e=Math.max(0,Math.min(n,Math.floor((Date.UTC(+p.year,+p.month-1,+p.day)-start)/86400000)+1));$('year').textContent=year;$('pct').textContent=(100*e/n).toFixed(1)+'%';$('elapsed').textContent=e+'일';$('remaining').textContent=(n-e)+'일';$('total').textContent=n+'일';$('grid').setAttribute('aria-label',e+'일 진행, '+(n-e)+'일 남음');const frag=document.createDocumentFragment();for(let i=0;i<n;i++){const d=document.createElement('div');d.className='day'+(i<e?' done':'');d.title=new Date(start+i*86400000).toISOString().slice(0,10);frag.append(d)}$('grid').replaceChildren(frag)}$('prev').onclick=()=>{if(year>1900){year--;render()}};$('next').onclick=()=>{if(year<9998){year++;render()}};render();setInterval(render,60000);</script></body></html>
